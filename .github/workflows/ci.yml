name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build app bundle (swiftc single module, strict concurrency, warnings as errors)
        run: ./scripts/build_app.sh

      - name: Docs consistency (README tree, no hard-coded versions, documented sizes)
        run: ./scripts/check_docs.sh

      - name: SwiftPM build
        run: swift build

      - name: Unit tests
        run: swift test
