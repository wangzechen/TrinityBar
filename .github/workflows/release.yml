name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; only the release job gets write access, plus the two scopes build provenance needs.
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify tag matches version.env
        run: |
          source version.env
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "${MARKETING_VERSION:-}" ]]; then
            echo "::error::MARKETING_VERSION is missing from version.env"
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$MARKETING_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION=$MARKETING_VERSION in version.env"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches version.env ($MARKETING_VERSION)"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build release archive
        run: ./scripts/build_app.sh --release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/TrinityBar-${{ github.ref_name }}-macos-arm64.zip

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ZIP="dist/TrinityBar-${TAG}-macos-arm64.zip"
          gh release create "$TAG" \
            --draft \
            --title "TrinityBar $TAG" \
            --generate-notes \
            "$ZIP" "$ZIP.sha256"
